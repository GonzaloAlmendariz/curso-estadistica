<div class="deck-chrome">
  <div class="deck-header">
    <div class="deck-week" id="deckWeek">Semana</div>
    <div class="deck-title" id="deckTitle">Título</div>
  </div>

  <div class="deck-footer">
    <div class="deck-footer-left">
      <div class="deck-nav-shell">
        <div class="deck-menu" id="deckMenu">
          <button
            class="deck-pill deck-pill-button"
            id="deckSectionButton"
            type="button"
            aria-haspopup="true"
            aria-expanded="false"
            aria-controls="deckSectionMenu"
          >
            <span class="deck-pill-label" id="deckSectionLabel">Sección</span>
            <span class="deck-pill-icon" aria-hidden="true">▾</span>
          </button>

          <div
            class="deck-menu-panel"
            id="deckSectionMenu"
            role="menu"
            aria-label="Navegación por secciones"
            hidden
          ></div>
        </div>

        <a class="deck-home-button" href="index.html">Índice</a>
      </div>
    </div>

    <div class="deck-footer-right">
      <div class="deck-progress" aria-label="Progreso">
        <div class="deck-progress-fill" id="deckProgressFill"></div>
      </div>
    </div>
  </div>
</div>

<script src="includes/chrome.js"></script>
